name: synapse
x-app: &app
  image: synapse-atlas:local
  build:
    context: ../..
    dockerfile: synapse/deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  init:
    <<: *app
    command:
      [
        init,
        --db,
        /data/synapse.sqlite,
        --server,
        "${MONOSUITE_SERVER_ID:?Set MONOSUITE_SERVER_ID in .env}",
      ]
    volumes:
      - observations:/data
    restart: "no"

  collector:
    <<: *app
    command:
      [
        collect,
        --db,
        /data/synapse.sqlite,
        --server,
        "${MONOSUITE_SERVER_ID:?Set MONOSUITE_SERVER_ID in .env}",
      ]
    environment:
      SYNAPSE_TOKEN_FILE: /run/credentials/monosuite.token
    volumes:
      - observations:/data
      - ./secrets/collector:/run/credentials:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, python, -m, synapse.health, /data/synapse.sqlite]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

  viewer:
    <<: *app
    environment:
      SYNAPSE_REQUIRE_AUTH: "${SYNAPSE_REQUIRE_AUTH:-false}"
    command:
      [serve, --db, /data/synapse.sqlite, --host, 0.0.0.0, --port, "8787"]
    # SQLite creates WAL coordination files; database connections remain read-only.
    volumes:
      - observations:/data
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      web:
        aliases: [synapse-viewer]

volumes:
  observations:

networks:
  web:
    external: true
    name: synapse_web
