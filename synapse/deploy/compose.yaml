name: synapse
x-app: &app
  image: synapse-atlas:local
  build:
    context: ../..
    dockerfile: synapse/deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  init:
    <<: *app
    command:
      [
        init,
        --db,
        /data/synapse.sqlite,
        --server,
        "${MONOSUITE_SERVER_ID:?Set MONOSUITE_SERVER_ID in .env}",
      ]
    volumes:
      - observations:/data
    restart: "no"

  collector:
    <<: *app
    command:
      [
        collect,
        --db,
        /data/synapse.sqlite,
        --server,
        "${MONOSUITE_SERVER_ID:?Set MONOSUITE_SERVER_ID in .env}",
      ]
    environment:
      SYNAPSE_TOKEN_FILE: /run/credentials/monosuite.token
    volumes:
      - observations:/data
      - ./secrets/collector:/run/credentials:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, python, -m, synapse.health, /data/synapse.sqlite]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

  viewer:
    <<: *app
    command:
      [serve, --db, /data/synapse.sqlite, --host, 0.0.0.0, --port, "8787"]
    volumes:
      - observations:/data:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2

  proxy:
    image: caddy:2-alpine
    environment:
      SYNAPSE_DOMAIN: "${SYNAPSE_DOMAIN:?Set SYNAPSE_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/staff.caddy:/etc/caddy/staff.caddy:ro
      - certificates:/data
      - proxy_config:/config
    depends_on: [viewer]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  observations:
  certificates:
  proxy_config:
